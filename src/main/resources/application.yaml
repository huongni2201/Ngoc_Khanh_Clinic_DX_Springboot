spring:
  flyway:
    enabled: false
  aop:
    proxy-target-class: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 2s
      timeout: 2s
  application:
    name: ngoc_khanh_clinic_backend
mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-handlers-package: com.ngockhanh.clinic.shared.infrastructure.mybatis
  map-underscore-to-camel-case: true
clinic:
  auth:
    jwt-key: ${NKC_AUTH_JWT_KEY:}
