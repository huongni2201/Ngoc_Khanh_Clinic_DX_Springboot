spring:
  flyway:
    enabled: false
  aop:
    proxy-target-class: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 2s
      timeout: 2s
  application:
    name: ngoc_khanh_clinic_backend
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-handlers-package: com.ngockhanh.clinic.shared.infrastructure.mybatis
  map-underscore-to-camel-case: true
clinic:
  auth:
    idle-timeout: 30m
    absolute-timeout: 8h
    cookie-secure: ${NKC_AUTH_COOKIE_SECURE:true}
    allowed-origins: ${NKC_AUTH_ALLOWED_ORIGINS:}
