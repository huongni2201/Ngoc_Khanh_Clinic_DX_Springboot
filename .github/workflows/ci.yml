name: Backend verification

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Check medical terminology
        run: node scripts/check-terminology.mjs
      - name: Verify compile, unit tests, module boundaries, and PostgreSQL 17 integration
        run: bash ./mvnw --batch-mode --no-transfer-progress verify
